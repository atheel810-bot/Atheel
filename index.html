                    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثـيل - ATHEEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #3e2723;       /* لون الحبر الداكن */
            --paper: #fdfaf5;    /* لون الورق القديم */
            --gold: #b08e4f;     /* لون ريشة القلم */
            --decoration: #d7ccc8;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Amiri', serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* زينة علوية: ريشة وقلم */
        header {
            width: 100%;
            padding: 40px 0 20px 0;
            text-align: center;
            position: relative;
        }

        .pen-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }

        h1 { 
            font-family: 'Aref Ruqaa', serif; /* خط الرقعة للعنوان */
            margin: 0;
            font-size: 4rem;
            color: var(--ink);
        }

        /* شريط زخرفي تحت العنوان */
        .decoration-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .line {
            width: 80px;
            height: 1px;
            background-color: var(--gold);
        }

        .dot { color: var(--gold); font-size: 1.2rem; }

        main {
            width: 85%;
            max-width: 400px;
            margin-top: 30px;
        }

        /* الأزرار بتصميم "محبرة" أو "لوحة مخطوطة" */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .nav-item {
            background-color: #fff;
            border: 1px solid var(--decoration);
            border-right: 6px solid var(--gold); /* تزيين جانبي يشبه حافة الكتاب */
            border-radius: 4px;
            padding: 18px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.03);
            transition: 0.3s;
        }

        .nav-item span {
            font-size: 1.5rem;
            color: var(--ink);
            font-weight: bold;
        }

        /* أيقونة قلم صغيرة بجانب كل خيار */
        .nav-item::after {
            content: '✎';
            color: var(--gold);
            font-size: 1.2rem;
        }

        .nav-item:active {
            transform: translateY(2px);
            background-color: #f9f9f9;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.9rem;
            color: var(--secondary);
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <span class="pen-icon">✒️</span>
        <h1>أثـيل</h1>
        <div class="decoration-line">
            <div class="line"></div>
            <span class="dot">❦</span>
            <div class="line"></div>
        </div>
    </header>

    <main>
        <nav class="nav-list">
            <a href="quran.html" class="nav-item">
                <span>القرآن الكريم</span>
            </a>
            
            <a href="poetry.html" class="nav-item">
                <span>عيون الشّعر</span>
            </a>
            
            <a href="dictionary.html" class="nav-item">
                <span>قاموس اللغة</span>
            </a>

            <a href="thoughts.html" class="nav-item">
                <span>رسائل وخواطر</span>
            </a>
        </nav>
    </main>

    <footer>
        خُطّت بيمين عَبِير • ٢٠٢٦
    </footer>

</body>
</html>
