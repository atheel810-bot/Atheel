                    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثـيل - ATHEEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #5d4037;    /* بني دافئ هادئ */
            --secondary: #a1887f;  /* لون ترابي فاتح */
            --bg: #ffffff;         /* خلفية بيضاء صافية */
            --accent: #d7ccc8;    /* لون التظليل الناعم */
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* رأس الصفحة بتصميم ناعم */
        header {
            width: 100%;
            padding: 50px 0 30px 0;
            text-align: center;
            background: linear-gradient(to bottom, #f9f5f3, #ffffff);
        }

        h1 { 
            font-family: 'Amiri', serif;
            margin: 0;
            font-size: 3.5rem;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .divider {
            width: 50px;
            height: 3px;
            background-color: var(--secondary);
            margin: 15px auto;
            border-radius: 2px;
        }

        main {
            width: 85%;
            max-width: 400px;
            margin-top: 20px;
        }

        /* قائمة الأزرار بتصميم عصري (Soft UI) */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item {
            background-color: #ffffff;
            border: 1px solid #f0e6e3;
            border-radius: 20px; /* حواف مستديرة ناعمة */
            padding: 22px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(93, 64, 55, 0.05); /* ظل خفيف جداً */
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* تأثير الحركة عند الضغط */
        .nav-item:active {
            transform: scale(0.96);
            background-color: #fdfaf9;
            border-color: var(--secondary);
        }

        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 0.8rem;
            color: #bcaaa4;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>أثـيل</h1>
        <div class="divider"></div>
        <p style="font-size: 0.9rem; color: #8d6e63;">طالبة الأدب العربي والمدرسة العليا</p>
    </header>

    <main>
        <nav class="nav-list">
            <a href="quran.html" class="nav-item">
                <span>القرآن الكريم</span>
            </a>
            
            <a href="poetry.html" class="nav-item">
                <span>عيون الشّعر</span>
            </a>
            
            <a href="dictionary.html" class="nav-item">
                <span>قاموس اللغة</span>
            </a>

            <a href="thoughts.html" class="nav-item">
                <span>رسائل وخواطر</span>
            </a>
        </nav>
    </main>

    <footer>
        عَبِير • ٢٠٢٦
    </footer>

</body>
</html>
