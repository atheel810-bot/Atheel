<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثِـيـل - المرجع الأدبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4e4bc; 
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #2c1e12;
            font-family: 'Amiri', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .paper-container {
            background-color: rgba(255, 255, 255, 0.3);
            padding: 40px 20px;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #d2b48c;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #5d3a1a;
            border-bottom: 2px double #8b4513;
        }

        .description {
            font-size: 1.3rem;
            margin: 20px 0;
            font-style: italic;
        }

        /* تصميم الأزرار (أبواب التطبيق) */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .nav-button {
            background-color: #8b4513;
            color: #f4e4bc;
            padding: 12px;
            text-decoration: none;
            font-size: 1.4rem;
            border-radius: 5px;
            transition: 0.3s;
            border: 1px solid #5d3a1a;
            cursor: pointer;
        }

        .nav-button:hover {
            background-color: #5d3a1a;
            transform: scale(1.02);
        }

        .footer-name {
            margin-top: 40px;
            font-size: 1rem;
            color: #8b4513;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="paper-container">
        <h1>أثِـيـل</h1>
        <p class="description">خزانة الأدب واللغة</p>

        <div class="nav-menu">
            <button class="nav-button" onclick="alert('سيتم فتح قسم القرآن قريباً')">📖 آيات من الذكر الحكيم</button>
            <button class="nav-button" onclick="alert('سيتم فتح الديوان قريباً')">📜 ديوان الشعر العربي</button>
            <button class="nav-button" onclick="alert('سيتم فتح المعجم قريباً')">🔍 القاموس المعجمي</button>
        </div>

        <div class="footer-name">
            إعداد مبرمجة أثيل 🌸
        </div>
    </div>

</body>
</html>
