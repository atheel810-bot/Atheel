<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثِـيـل - المخطوطة الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4e4bc; 
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #2c1e12;
            font-family: 'Amiri', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .paper-container {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 40px 20px;
            border-radius: 2px;
            box-shadow: 0 0 25px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #d2b48c;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #5d3a1a;
            border-bottom: 2px double #8b4513;
            display: inline-block;
            padding-bottom: 5px;
        }

        .subtitle {
            font-size: 1.4rem;
            margin: 15px 0 30px 0;
            font-style: italic;
            color: #8b4513;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* تنسيق الأزرار كروابط أنيقة */
        .nav-link {
            background-color: #8b4513;
            color: #f4e4bc;
            padding: 15px;
            text-decoration: none;
            font-size: 1.3rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 1px solid #5d3a1a;
            display: block; /* لجعل الرابط يأخذ عرض الصفحة */
        }

        .nav-link:hover {
            background-color: #5d3a1a;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 40px;
            font-size: 1rem;
            color: #8b4513;
            border-top: 1px solid rgba(139, 69, 19, 0.2);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="paper-container">
        <h1>أثِـيـل</h1>
        <div class="subtitle">خزانة الأدب واللغة والذكر</div>

        <div class="nav-menu">
            <a href="quran.html" class="nav-link">📖 آيات من الذكر الحكيم</a>
            <a href="poetry.html" class="nav-link">📜 ديوان الشعر العربي</a>
            <a href="dictionary.html" class="nav-link">🔍 القاموس المعجمي</a>
        </div>

        <div class="footer">
            بأنامل طالبة الأدب العربي: عبير 🌸
        </div>
    </div>

</body>
</html>
